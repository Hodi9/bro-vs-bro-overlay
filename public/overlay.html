<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<title>Bro vs Bro — Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap');

  :root {
    --ink: #15130f;
    --bone: #f3ede0;
    --bone-dim: #c9c0ae;
    --marcelo: #c9702f;
    --aggo: #3f93b5;
    --gold: #d7ab4d;
    --line: rgba(243, 237, 224, 0.14);
    --shadow: rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;
    color: var(--bone);
    font-family: 'Barlow', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  [data-view] { display: none; }
  [data-view].active { display: block; }

  /* ---- scoreboard (persistent top bar) ---- */
  #scoreboard-view { padding: 24px; }
  .scoreboard {
    display: flex;
    align-items: stretch;
    width: 640px;
    background: rgba(21, 19, 15, 0.92);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 60px -24px var(--shadow);
    transition: opacity 0.3s ease;
  }
  .sb-side { flex: 1; display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
  .sb-side.sb-aggo { flex-direction: row-reverse; text-align: right; }
  .sb-photo { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .sb-marcelo .sb-photo { box-shadow: inset 0 0 0 2px var(--marcelo); }
  .sb-aggo .sb-photo { box-shadow: inset 0 0 0 2px var(--aggo); }
  .sb-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; filter: grayscale(0.4); }
  .sb-marcelo .sb-photo img { object-position: center 40%; }
  .sb-info { display: flex; flex-direction: column; gap: 2px; }
  .sb-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px; }
  .sb-round { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; color: var(--bone-dim); }
  .sb-score { font-family: 'Anton', sans-serif; font-size: 36px; font-variant-numeric: tabular-nums; line-height: 1; transition: transform 0.25s ease; }
  .sb-marcelo .sb-score { color: var(--marcelo); }
  .sb-aggo .sb-score { color: var(--aggo); }
  .sb-score.bump { transform: scale(1.3); }
  .sb-center { width: 96px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--ink); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .sb-center .vs-mini { font-family: 'Anton', sans-serif; font-size: 14px; color: var(--gold); }
  .sb-center .round-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px; color: var(--bone-dim); text-align: center; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-center .round-num { font-family: 'Anton', sans-serif; font-size: 22px; color: var(--bone); }

  /* ---- fight card (intro / transition) ---- */
  #fightcard-view { width: 1920px; height: 1080px; position: relative; }
  .hero { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .hero-inner { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .corner { position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .corner.marcelo-corner { background: linear-gradient(160deg, #2a1408 0%, #1d1a15 72%); }
  .corner.aggo-corner { background: linear-gradient(200deg, #08222b 0%, #1d1a15 72%); }
  .corner-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; filter: grayscale(1) contrast(1.15) brightness(0.85); mix-blend-mode: luminosity; }
  .corner.marcelo-corner .corner-photo { object-position: center 40%; }
  .corner.aggo-corner .corner-photo { object-position: center 50%; }
  .corner.marcelo-corner::before, .corner.aggo-corner::before { content: ""; position: absolute; inset: 0; mix-blend-mode: color; z-index: 1; }
  .corner.marcelo-corner::before { background: var(--marcelo); }
  .corner.aggo-corner::before { background: var(--aggo); }
  .corner.marcelo-corner::after, .corner.aggo-corner::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(0deg, #1d1a15 0%, transparent 46%); }
  .corner-label { position: relative; z-index: 3; width: 100%; padding: 40px 64px 56px; display: flex; flex-direction: column; gap: 8px; }
  .marcelo-corner .corner-label { text-align: left; align-items: flex-start; }
  .aggo-corner .corner-label { text-align: right; align-items: flex-end; }
  .corner-eyebrow { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; font-size: 22px; }
  .marcelo-corner .corner-eyebrow { color: var(--marcelo); }
  .aggo-corner .corner-eyebrow { color: var(--aggo); }
  .corner-name { font-family: 'Anton', sans-serif; font-size: 140px; line-height: 0.92; text-transform: uppercase; color: var(--bone); }
  .vs-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; width: 200px; height: 200px; border-radius: 50%; background: var(--ink); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px #1d1a15, 0 30px 70px -16px var(--shadow); }
  .vs-badge span { font-family: 'Anton', sans-serif; font-size: 50px; color: var(--gold); }
  .hero-title { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); z-index: 6; text-align: center; }
  .hero-title .lockup { font-family: 'Anton', sans-serif; font-size: 72px; letter-spacing: 0.02em; color: var(--bone); text-shadow: 0 10px 40px var(--shadow); }
</style>
</head>
<body>

  <div id="scoreboard-view" data-view>
    <div class="scoreboard">
      <div class="sb-side sb-marcelo">
        <div class="sb-photo"><img src="/images/marcelo.png" alt="Marcelo" /></div>
        <div class="sb-info"><span class="sb-name">Marcelo</span><span class="sb-round">Rødt hjørne</span></div>
        <span class="sb-score" id="sb-marcelo-score">0</span>
      </div>
      <div class="sb-center">
        <span class="vs-mini">VS</span>
        <span class="round-num" id="sb-round-num">1</span>
        <span class="round-label" id="sb-round-label">Dart</span>
      </div>
      <div class="sb-side sb-aggo">
        <span class="sb-score" id="sb-aggo-score">0</span>
        <div class="sb-info"><span class="sb-name">Aggo</span><span class="sb-round">Blåt hjørne</span></div>
        <div class="sb-photo"><img src="/images/aggo.png" alt="Aggo" /></div>
      </div>
    </div>
  </div>

  <div id="fightcard-view" data-view>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-title"><span class="lockup">BRO VS BRO</span></div>
        <div class="corner marcelo-corner">
          <img class="corner-photo" src="/images/marcelo.png" alt="Marcelo" />
          <div class="corner-label"><span class="corner-eyebrow">Rødt hjørne</span><span class="corner-name">Marcelo</span></div>
        </div>
        <div class="corner aggo-corner">
          <img class="corner-photo" src="/images/aggo.png" alt="Aggo" />
          <div class="corner-label"><span class="corner-eyebrow">Blåt hjørne</span><span class="corner-name">Aggo</span></div>
        </div>
        <div class="vs-badge"><span>VS</span></div>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const view = params.get("view") || "scoreboard";
  document.querySelectorAll("[data-view]").forEach((el) => el.classList.remove("active"));
  const active = document.getElementById(view + "-view");
  (active || document.getElementById("scoreboard-view")).classList.add("active");

  const socket = io();
  let lastScores = { marcelo: 0, aggo: 0 };

  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  socket.on("state", (state) => {
    const sbM = document.getElementById("sb-marcelo-score");
    const sbA = document.getElementById("sb-aggo-score");
    if (sbM) { if (state.scores.marcelo !== lastScores.marcelo) bump(sbM); sbM.textContent = state.scores.marcelo; }
    if (sbA) { if (state.scores.aggo !== lastScores.aggo) bump(sbA); sbA.textContent = state.scores.aggo; }
    const rn = document.getElementById("sb-round-num");
    const rl = document.getElementById("sb-round-label");
    if (rn) rn.textContent = state.round;
    if (rl) rl.textContent = state.current?.name || "";

    lastScores = { ...state.scores };
  });
</script>
</body>
</html>
